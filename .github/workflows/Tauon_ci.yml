name: Tauon Copr CI

on:
  schedule:
    # Brisbane, Avustralya (UTC+10) saatine göre 12:00 (Öğle) ve 18:00 (İş Çıkışı)
    - cron: '0 2,8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'specs/Tauon.spec'
      - 'sources/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  # 1. AŞAMA: Güncelleme Kontrolü
    # 1. AŞAMA: Güncelleme Kontrolü
  check_update:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    env:
      COPR_API: https://copr.fedorainfracloud.org/api_3/build/list
      COPR_OWNER: universish
      COPR_PROJECT: Tauon..MusicBox
      COPR_PACKAGE: tauon
      TARGET_CHROOTS: fedora-44-x86_64 fedora-44-aarch64 fedora-rawhide-x86_64 fedora-rawhide-aarch64
    steps:
      - name: Upstream Sürümünü ve Copr Durumunu Kontrol Et
        id: check
        run: |
          set -euo pipefail

          LATEST_TAG=$(curl -fsSL "https://api.github.com/repos/Taiko2k/Tauon/releases/latest" | jq -er '.tag_name')
          VERSION="${LATEST_TAG#v}"

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Copr, build/list API'sinde sayfalama kullanılmasını önerir.
          # Bu döngü tüm erişilebilir derleme geçmişini tek bir JSON belgesinde toplar.
          BUILDS_FILE=$(mktemp)
          trap 'rm -f "$BUILDS_FILE"' EXIT
          echo '{"items":[]}' > "$BUILDS_FILE"

          OFFSET=0
          LIMIT=100

          while true; do
            PAGE=$(curl -fsSL -G "$COPR_API" \
              --data-urlencode "ownername=$COPR_OWNER" \
              --data-urlencode "projectname=$COPR_PROJECT" \
              --data-urlencode "packagename=$COPR_PACKAGE" \
              --data-urlencode "limit=$LIMIT" \
              --data-urlencode "offset=$OFFSET")

            PAGE_COUNT=$(jq '.items | length' <<< "$PAGE")
            if [ "$PAGE_COUNT" -eq 0 ]; then
              break
            fi

            jq -s '.[0].items + .[1].items | {items: .}' \
              "$BUILDS_FILE" "$PAGE" > "${BUILDS_FILE}.new"
            mv "${BUILDS_FILE}.new" "$BUILDS_FILE"

            if [ "$PAGE_COUNT" -lt "$LIMIT" ]; then
              break
            fi

            OFFSET=$((OFFSET + PAGE_COUNT))
          done

          CHROOTS_JSON=$(jq -n '$ENV.TARGET_CHROOTS | split(" ")')

          # Sadece tam olarak aynı upstream sürümü değerlendirilir.
          # Örneğin 13.1.1 için 13.1.10-1 yanlışlıkla eşleşmez.
          #
          # Burada yalnızca başarılı derlemeler değil, gönderilmiş tüm derlemeler
          # sayılır. Böylece başarısız veya iptal edilmiş bir X-1 derlemesinden
          # sonra yapılan yeniden deneme X-2 olur ve NVR çakışması oluşmaz.
          MAX_RELEASE=$(jq -r --arg ver "$VERSION" '
            [
              .items[]?
              | (.source_package.version // "") as $nvr
              | select($nvr | startswith($ver + "-"))
              | ($nvr | split("-") | .[-1] | split(".") | .[0])
              | select(test("^[0-9]+$"))
              | tonumber
            ] | max // 0
          ' "$BUILDS_FILE")

          # Aynı upstream sürümünün dört hedef chroot'unun tamamında en az birer
          # başarılı Copr derlemesi varsa sürüm tam olarak yayınlanmış demektir.
          PUBLISHED=$(jq -r --arg ver "$VERSION" --argjson chroots "$CHROOTS_JSON" '
            [
              $chroots[] as $c
              | any(
                  .items[]?;
                  .state == "succeeded"
                  and ((.source_package.version // "") | startswith($ver + "-"))
                  and ((.chroots // []) | index($c) != null)
                )
            ] | all
          ' "$BUILDS_FILE")

          # Bir önceki iş akışından kalan bekleyen veya çalışan derleme varsa
          # ikinci zamanlanmış tetikleme aynı paket için yeni bir derleme kuyruğa eklemez.
          ACTIVE=$(jq -r --arg ver "$VERSION" --argjson chroots "$CHROOTS_JSON" '
            [
              $chroots[] as $c
              | any(
                  .items[]?;
                  (.state as $s
                    | ["waiting", "pending", "importing", "starting", "running"]
                    | index($s) != null)
                  and ((.source_package.version // "") | startswith($ver + "-"))
                  and ((.chroots // []) | index($c) != null)
                )
            ] | any
          ' "$BUILDS_FILE")

          RELEASE=$((MAX_RELEASE + 1))
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

          # Manuel çalıştırma ve spec/sources değişikliğiyle gelen push bilinçli
          # yeniden paketleme sayılır; Release bir artırılarak devam eder.
          # Yalnızca zamanlanmış çalıştırmada yayınlanmış veya hâlâ işlenen sürüm
          # paketleme adımlarına geçilmesini engeller.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            BUILD_NEEDED=true
          elif [ "$PUBLISHED" = "true" ] || [ "$ACTIVE" = "true" ]; then
            BUILD_NEEDED=false
          else
            BUILD_NEEDED=true
          fi

          echo "build_needed=$BUILD_NEEDED" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_NEEDED" = "true" ]; then
            echo "::notice::Copr derlemesi gerekiyor: $VERSION-$RELEASE"
          elif [ "$PUBLISHED" = "true" ]; then
            echo "::notice::$VERSION sürümü Copr'da zaten yayınlanmış; paketleme atlanıyor."
          else
            echo "::notice::$VERSION sürümü için Copr'da etkin bir derleme bulundu; yeni derleme kuyruğa eklenmiyor."
          fi

  # 2. AŞAMA: İndirme ve SRPM Paketleme (Yalnızca yeni sürüm varsa çalışır)
  build_package:
    needs: check_update
    if: needs.check_update.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kaynakları İndir ve Spec Dosyasını Hazırla
        run: |
          TAG="${{ needs.check_update.outputs.latest_tag }}"
          VERSION="${{ needs.check_update.outputs.version }}"
          RELEASE="${{ needs.check_update.outputs.release }}"

          mkdir -p rpmbuild/SOURCES
          curl -sL "https://github.com/Taiko2k/Tauon/releases/download/${TAG}/TauonMusicBox-linux.7z" -o rpmbuild/SOURCES/TauonMusicBox-linux.7z
          curl -sL "https://github.com/Taiko2k/Tauon/releases/download/${TAG}/TauonMusicBox-linux-arm64.7z" -o rpmbuild/SOURCES/TauonMusicBox-linux-arm64.7z

          if [ -d sources ] && [ "$(ls -A sources)" ]; then cp sources/* rpmbuild/SOURCES/; fi
          
          # EKLENEN KISIM: assets dizinini sıkıştırıp build ortamına (SOURCES) aktar
          if [ -d assets ]; then
            tar -czf rpmbuild/SOURCES/assets.tar.gz assets/
          fi
          
          sed -i -E "s/^(Version:[[:space:]]*).*/\1${VERSION}/" specs/Tauon.spec
          sed -i -E "s/^(Release:[[:space:]]*).*/\1${RELEASE}%{?dist}/" specs/Tauon.spec
          
      - name: Fedora Docker ile SRPM Üret
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:latest bash -c "
            dnf install -y rpmdevtools rpm-build && \
            rpmbuild -bs --define '_topdir /workspace/rpmbuild' --define '_sourcedir /workspace/rpmbuild/SOURCES' specs/Tauon.spec
          "

      - name: Üretilen SRPM Dosyasını Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: srpm-package
          path: rpmbuild/SRPMS/*.src.rpm

  # 3. AŞAMA: Copr'a Gönderim ve Git Güncellemesi
  publish_copr:
    needs: [check_update, build_package]
    if: needs.check_update.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: SRPM Dosyasını İndir
        uses: actions/download-artifact@v4
        with:
          name: srpm-package
          path: srpms/

      - name: Copr CLI Kurulumu ve SRPM Gönderimi
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_URL: ${{ secrets.COPR_URL }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e COPR_LOGIN -e COPR_USERNAME -e COPR_TOKEN -e COPR_URL \
            fedora:latest bash -c '
              dnf install -y copr-cli && \
              mkdir -p ~/.config && \
              printf "[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = %s\n" \
                "$COPR_LOGIN" "$COPR_USERNAME" "$COPR_TOKEN" "$COPR_URL" > ~/.config/copr && \
              chmod 600 ~/.config/copr && \
              SRPM_FILE=$(ls /workspace/srpms/*.src.rpm | head -n 1) && \
              copr-cli build --nowait \
                --chroot fedora-44-x86_64 \
                --chroot fedora-44-aarch64 \
                --chroot fedora-rawhide-x86_64 \
                --chroot fedora-rawhide-aarch64 \
                universish/Tauon..MusicBox "$SRPM_FILE"
            '

      - name: Spec Değişikliğini ve Git Etiketini Kaydet
        run: |
          VERSION="${{ needs.check_update.outputs.version }}"
          RELEASE="${{ needs.check_update.outputs.release }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          sed -i -E "s/^(Version:[[:space:]]*).*/\1${VERSION}/" specs/Tauon.spec
          sed -i -E "s/^(Release:[[:space:]]*).*/\1${RELEASE}%{?dist}/" specs/Tauon.spec
          
          git add specs/Tauon.spec
          git diff --staged --quiet || git commit -m "chore(release): build v${VERSION}-${RELEASE}"
          
          git pull --rebase origin main
          git push origin main
          git tag -f "v${VERSION}"
          git push origin "refs/tags/v${VERSION}" --force
    
